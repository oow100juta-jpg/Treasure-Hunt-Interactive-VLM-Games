<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantic Treasure Hunt</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">AI CAMERA GAME</p>
      <h1>Semantic Treasure Hunt</h1>
      <p class="intro">
        Find a real object that matches the meaning of the clue.
      </p>

      <div class="clue-box">
        <span id="roundLabel">LOADING CLUE...</span>
        <strong id="clueText">Please wait</strong>
      </div>

      <!-- Live camera viewfinder -->
      <div id="cameraContainer" class="camera-container" hidden>
        <video id="viewfinder" autoplay playsinline muted></video>
        <button id="captureButton" class="capture-btn" aria-label="Capture photo">
          <span class="capture-ring"></span>
        </button>
      </div>

      <!-- Shown before camera starts -->
      <button id="startCamera" class="start-camera-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Open camera
      </button>

      <!-- Captured snapshot preview -->
      <canvas id="snapshotCanvas" hidden></canvas>
      <img id="preview" alt="Captured photo" hidden />

      <div id="capturedActions" class="captured-actions" hidden>
        <button id="retakeButton" class="secondary">Retake</button>
        <button id="checkButton" disabled>Check my treasure</button>
      </div>

      <section id="result" class="result" hidden>
        <h2 id="resultTitle"></h2>
        <p id="resultMessage"></p>

        <div class="meter">
          <div id="meterFill"></div>
        </div>

        <p id="scoreText"></p>
        <p id="reasonText"></p>
        <button id="nextButton" class="secondary" hidden>Next clue</button>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
